service: rk-frontend

provider:
  name: aws
  region: eu-west-1
  stage: ${opt:stage, 'dev'}

plugins:
  - serverless-finch
  - serverless-single-page-app-plugin
  - serverless-s3-sync
  - serverless-cloudfront-invalidate

custom:
  client:
    bucketName: rk-frontend-app-${self:provider.stage}
    distributionFolder: dist
    indexDocument: index.html
    errorDocument: index.html
    deploy: true
    manageResources: false
  s3Sync:
    - bucketName: ${self:custom.client.bucketName}
      localDir: ${self:custom.client.distributionFolder}
      deleteRemoved: true
      params:
        - 'index.html':
            CacheControl: 'no-cache, no-store, must-revalidate'
        - '**/*.js':
            CacheControl: 'public, max-age=31536000'
        - '**/*.css':
            CacheControl: 'public, max-age=31536000'
        - '**/*.png':
            CacheControl: 'public, max-age=31536000'
        - '**/*.jpg':
            CacheControl: 'public, max-age=31536000'
  cloudfrontInvalidate:
    - distributionIdKey: CloudFrontDistributionId
      items:
        - "/*"

resources:
  Resources:
    WebAppS3Bucket:
      Type: AWS::S3::Bucket
      Properties:
        BucketName: ${self:custom.client.bucketName}
        WebsiteConfiguration:
          IndexDocument: ${self:custom.client.indexDocument}
          ErrorDocument: ${self:custom.client.errorDocument}
        OwnershipControls:
          Rules:
            - ObjectOwnership: BucketOwnerEnforced
        PublicAccessBlockConfiguration:
          BlockPublicAcls: true
          BlockPublicPolicy: false
          IgnorePublicAcls: true
          RestrictPublicBuckets: false
        CorsConfiguration:
          CorsRules:
            - AllowedHeaders: ['*']
              AllowedMethods: [GET, PUT, POST, DELETE, HEAD]
              AllowedOrigins: ['*']
              MaxAge: 3000

    CloudFrontOriginAccessIdentity:
      Type: AWS::CloudFront::CloudFrontOriginAccessIdentity
      Properties:
        CloudFrontOriginAccessIdentityConfig:
          Comment: OAI for ${self:custom.client.bucketName}

    WebAppS3BucketPolicy:
      Type: AWS::S3::BucketPolicy
      Properties:
        Bucket: !Ref WebAppS3Bucket
        PolicyDocument:
          Statement:
            - Action: 's3:GetObject'
              Effect: Allow
              Resource: !Join ['', ['arn:aws:s3:::', !Ref WebAppS3Bucket, '/*']]
              Principal:
                CanonicalUser: !GetAtt CloudFrontOriginAccessIdentity.S3CanonicalUserId

    CloudFrontDistribution:
      Type: AWS::CloudFront::Distribution
      Properties:
        DistributionConfig:
          Origins:
            - DomainName: !GetAtt WebAppS3Bucket.RegionalDomainName
              Id: WebApp
              S3OriginConfig:
                OriginAccessIdentity: !Join ['', ['origin-access-identity/cloudfront/', !Ref CloudFrontOriginAccessIdentity]]
          Enabled: true
          DefaultRootObject: index.html
          CustomErrorResponses:
            - ErrorCode: 404
              ResponseCode: 200
              ResponsePagePath: /index.html
          DefaultCacheBehavior:
            AllowedMethods:
              - DELETE
              - GET
              - HEAD
              - OPTIONS
              - PATCH
              - POST
              - PUT
            TargetOriginId: WebApp
            ForwardedValues:
              QueryString: false
              Headers: ['Origin', 'Access-Control-Request-Method', 'Access-Control-Request-Headers']
              Cookies:
                Forward: none
            ViewerProtocolPolicy: redirect-to-https
          ViewerCertificate:
            CloudFrontDefaultCertificate: true

    CognitoUserPool:
      Type: AWS::Cognito::UserPool
      Properties:
        UserPoolName: rk-frontend-userpool-${self:provider.stage}
        AutoVerifiedAttributes:
          - email
        Schema:
          - Name: email
            Required: true
            Mutable: true
          - Name: name
            Required: true
            Mutable: true
          - Name: role
            AttributeDataType: String
            Mutable: true
        Policies:
          PasswordPolicy:
            MinimumLength: 8
            RequireUppercase: false
            RequireLowercase: false
            RequireNumbers: true
            RequireSymbols: false

    CognitoUserPoolClient:
      Type: AWS::Cognito::UserPoolClient
      Properties:
        ClientName: rk-frontend-app-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool
        GenerateSecret: false
        ExplicitAuthFlows:
          - ADMIN_NO_SRP_AUTH
          - USER_PASSWORD_AUTH

    CognitoUserPoolDomain:
      Type: AWS::Cognito::UserPoolDomain
      Properties:
        Domain: rk-frontend-${self:provider.stage}
        UserPoolId: !Ref CognitoUserPool

  Outputs:
    WebAppS3BucketOutput:
      Value: !Ref WebAppS3Bucket
    CloudFrontDistributionId:
      Value: !Ref CloudFrontDistribution
    CloudFrontDistributionOutput:
      Value: !GetAtt CloudFrontDistribution.DomainName
    CognitoUserPoolId:
      Value: !Ref CognitoUserPool
    CognitoUserPoolClientId:
      Value: !Ref CognitoUserPoolClient
    CognitoUserPoolDomain:
      Value: !Ref CognitoUserPoolDomain
